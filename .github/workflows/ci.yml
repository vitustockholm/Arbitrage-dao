name: CI

on:
  push:
  pull_request:

jobs:
  mock-tests:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NO_FORK: "true"
      ARB_MAINNET_RPC_URL: ""
      ARB_SEPOLIA_RPC_URL: ""
      MAINNET_RPC_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --force

      - name: Compile
        run: npm run compile

      - name: Run Mock Tests
        run: npm run test:mock

  fork-tests:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NO_FORK: "false"
      ARB_MAINNET_RPC_URL: ${{ secrets.ARB_MAINNET_RPC_URL }}
      MAINNET_RPC_URL: ${{ secrets.ARB_MAINNET_RPC_URL }}
      ARB_SEPOLIA_RPC_URL: ${{ secrets.ARB_SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --force

      - name: Compile
        run: npm run compile

      - name: Run Fork Tests If Secret Exists
        shell: bash
        run: |
          if [ -z "$ARB_MAINNET_RPC_URL" ]; then
            echo "ARB_MAINNET_RPC_URL is not configured. Skipping fork tests."
            exit 0
          fi
          npm run test:fork
