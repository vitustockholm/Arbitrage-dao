name: CI

on:
  push:
  pull_request:

jobs:
  mock-tests:
    runs-on: ubuntu-latest

    env:
      NO_FORK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npx hardhat compile

      - name: Run Mock Tests
        run: npx hardhat test test/mock-mode.test.ts

  fork-tests:
    runs-on: ubuntu-latest

    env:
      ARB_MAINNET_RPC_URL: ${{ secrets.ARB_MAINNET_RPC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npx hardhat compile

      - name: Run Fork Tests
        run: npx hardhat test test/fork-network.test.ts
